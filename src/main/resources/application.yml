spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
app:
  jwt:
    secret: your-very-secure-secret-key-at-least-256-bits-long
    expiration-ms: 86400000 # 24 часа
  default-password:
    password
  dump:
    cron: 0 0 17 * * *
telegram:
  bot:
    token: ${TELEGRAM_BOT}
  chat:
    id: ${CHAT_ID}
db:
  container:
    name: postgres_db
  name: ${DB_NAME}

google:
  calendar:
    calendar-id: ${GOOGLE_CALENDAR_ID:primary}
    webhook-base-url: ${WEBHOOK_BASE_URL:}
    webhook-path: /api/google-calendar/webhook
    oauth:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
      refresh-token: ${GOOGLE_OAUTH_REFRESH_TOKEN:}
      redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/api/google-calendar/oauth/callback}
    sync:
      initial-lookback: P30D
      lookahead: P60D
      poll-interval: PT5M
      max-results: 2500
      enabled: true
    llm:
      provider: groq
      api-key: ${GROQ_API_KEY:}
      base-url: https://api.groq.com/openai/v1
      model: llama-3.3-70b-versatile
      timeout-seconds: 30
      enabled: true